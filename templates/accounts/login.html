{% extends "base.html" %}

{% block title %}Login | DevConnect{% endblock %}

{% block content %}

<div class="container py-5">
    <h2>Login to DevConnect</h2>
    <p>Welcome back!</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Login
        </button>
    </form>

    <p class="mt-3">
        Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>
</div>

{% endblock %}
