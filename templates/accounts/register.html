{% extends "base.html" %}

{% block title %}Register | DevConnect{% endblock %}

{% block content %}

<div class="container py-5">
    <h2>Create Your Account</h2>
    <p>Join the DevConnect community.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Register
        </button>
    </form>
</div>

{% endblock %}
