{% extends "base.html" %}

{% block title %}Create Post | DevConnect{% endblock %}

{% block content %}

<div class="container py-5">

    <h2>Share Your Thoughts</h2>
    <p>Share your coding journey, knowledge, and ideas.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Publish Post
        </button>
    </form>

</div>

{% endblock %}
