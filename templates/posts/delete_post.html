{% extends "base.html" %}

{% block title %}Delete Post | DevConnect{% endblock %}

{% block content %}

<div class="container py-5">

    <h2>Delete Post</h2>

    <p>Are you sure you want to delete this post?</p>

    <div class="card mb-3">
        <div class="card-body">
            {{ post.content }}
        </div>
    </div>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Yes, Delete
        </button>

        <a href="{% url 'post_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
