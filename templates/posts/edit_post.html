{% extends "base.html" %}

{% block title %}Edit Post | DevConnect{% endblock %}

{% block content %}

<div class="container py-5">

    <h2>Edit Your Post</h2>
    <p>Update your thoughts or coding experience.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Update Post
        </button>

        <a href="{% url 'post_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
